<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محمد وليد مسعد | اختبر نفسك</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#071426}
body{font-family:Tahoma,Arial,sans-serif}
.home{
  min-height:100vh;
  background:#071426 url("home-interface.png") center top/cover no-repeat;
  position:relative;
}
.start-btn{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:81.5%;
  width:min(42%,560px);
  height:92px;
  border:0;
  border-radius:24px;
  background:transparent;
  cursor:pointer;
}
.start-btn:focus{outline:3px solid #fff}
@media(max-width:700px){
  .home{background-size:cover;background-position:center top}
  .start-btn{top:80%;width:62%;height:75px}
}
@media(max-width:430px){
  .start-btn{top:79.5%;width:70%;height:62px}
}
#login,#quiz,#result{display:none}
.panel{
  min-height:100vh;padding:30px 18px;background:linear-gradient(180deg,#24233f,#0b1728);
  color:#fff;text-align:center
}
.box{max-width:650px;margin:60px auto;padding:35px 22px;background:#20244d;border:2px solid #c9a64a;border-radius:28px}
input{width:100%;padding:16px;border-radius:14px;border:1px solid #5d6688;background:#101b35;color:#fff;font-size:18px}
button.next,.enter{margin-top:18px;width:100%;padding:16px;border:0;border-radius:16px;background:#ffb52f;color:#101827;font-weight:bold;font-size:20px}
</style>
</head>
<body>

<section id="home" class="home" aria-label="الصفحة الرئيسية">
  <button class="start-btn" aria-label="ابدأ الامتحان" onclick="openLogin()"></button>
</section>

<section id="login" class="panel">
  <div class="box">
    <h1>تسجيل الدخول</h1>
    <p>اكتب اسمك الثلاثي للبدء.</p>
    <input id="name" placeholder="الاسم الثلاثي">
    <button class="enter" onclick="start()">دخول الامتحان</button>
  </div>
</section>

<section id="quiz" class="panel">
  <div class="box">
    <p id="count"></p>
    <h2 id="q"></h2>
    <div id="answers"></div>
    <button id="next" class="next" disabled onclick="goNext()">التالي ←</button>
  </div>
</section>

<section id="result" class="panel">
  <div class="box">
    <h1>انتهى الامتحان 🏆</h1>
    <h2 id="score"></h2>
    <button class="enter" onclick="location.reload()">إعادة الاختبار</button>
  </div>
</section>

<script>
const bank=[
["ما عاصمة مصر؟",["القاهرة","الإسكندرية","أسوان","الأقصر"],0],
["ما أكبر قارة في العالم مساحة؟",["أفريقيا","آسيا","أوروبا","أستراليا"],1],
["ما النهر الذي يمر في مصر؟",["الأمازون","النيل","الدانوب","السين"],1],
["في أي قارة تقع مصر؟",["آسيا","أوروبا","أفريقيا","أمريكا الجنوبية"],2],
["ما البحر الذي يفصل مصر عن شبه الجزيرة العربية؟",["البحر الأحمر","البحر الأسود","بحر قزوين","بحر الشمال"],0],
["ما عاصمة السعودية؟",["جدة","الرياض","الدمام","مكة"],1],
["ما القارة المعروفة بالقارة السمراء؟",["أفريقيا","آسيا","أوروبا","أمريكا الشمالية"],0],
["أين تقع قناة السويس؟",["مصر","المغرب","اليمن","العراق"],0],
["ما عاصمة فرنسا؟",["مدريد","باريس","روما","برلين"],1],
["من بنى الأهرامات في مصر القديمة؟",["الفراعنة","الرومان","المغول","الإنكا"],0],
["ما عاصمة إيطاليا؟",["روما","ميلانو","نابولي","تورينو"],0],
["في أي قارة تقع البرازيل؟",["أفريقيا","أمريكا الجنوبية","آسيا","أوروبا"],1],
["ما الحضارة التي قامت على ضفاف النيل؟",["المصرية القديمة","الإنكا","الصينية","الرومانية"],0],
["ما عاصمة اليابان؟",["طوكيو","بكين","سيول","بانكوك"],0],
["ما أكبر محيط في العالم؟",["الأطلسي","الهندي","الهادئ","المتجمد الشمالي"],2],
["ما عاصمة ألمانيا؟",["برلين","فيينا","براغ","وارسو"],0],
["أين توجد أهرامات الجيزة؟",["الجيزة","أسوان","الأقصر","بورسعيد"],0],
["ما عاصمة الأردن؟",["عمّان","بيروت","دمشق","بغداد"],0],
["ما الدولة التي تقع فيها مكة المكرمة؟",["السعودية","مصر","الأردن","العراق"],0],
["ما عاصمة المغرب؟",["الرباط","الدار البيضاء","مراكش","فاس"],0]
];
let qs=[],i=0,s=0,locked=false;
function show(id){for(const x of ["home","login","quiz","result"])document.getElementById(x).style.display="none";document.getElementById(id).style.display="block"}
function openLogin(){show("login")}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function start(){
 const n=document.getElementById("name").value.trim();
 if(n.split(/\s+/).length<3){alert("اكتب الاسم الثلاثي.");return}
 qs=shuffle(bank).map(x=>{let a=x[1].map((t,k)=>({t,ok:k===x[2]}));return [x[0],shuffle(a)]}).slice(0,20);
 i=0;s=0;show("quiz");render()
}
function render(){
 locked=false;document.getElementById("count").textContent=`السؤال ${i+1} من 20`;
 document.getElementById("q").textContent=qs[i][0];
 const box=document.getElementById("answers");box.innerHTML="";
 const next=document.getElementById("next");next.disabled=true;
 qs[i][1].forEach(o=>{
  const b=document.createElement("button");b.textContent=o.t;b.className="next";b.style.background="#292d58";b.style.color="#fff";
  b.onclick=()=>pick(b,o.ok);box.appendChild(b)
 })
}
function pick(btn,ok){
 if(locked)return;locked=true;
 [...document.querySelectorAll("#answers button")].forEach(b=>b.disabled=true);
 if(ok){btn.style.background="#21d6a5";s++}
 else{
  btn.style.background="#ff4f78";
  const right=qs[i][1].findIndex(x=>x.ok);
  document.querySelectorAll("#answers button")[right].style.background="#21d6a5";
 }
 document.getElementById("next").disabled=false
}
function goNext(){i++;if(i<20)render();else{show("result");document.getElementById("score").textContent=`نتيجتك: ${s}/20`}}
</script>
</body>
</html>
